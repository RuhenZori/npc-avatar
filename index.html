<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NPC Avatar</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000;
}
</style>
</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 3);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

let light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light1);

let light2 = new THREE.DirectionalLight(0xffffff, 1);
light2.position.set(3, 5, 2);
scene.add(light2);

let controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

let mixer;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
loader.load("./CombatCharacter.glb", (gltf) => {

    const model = gltf.scene;
    scene.add(model);

    // Centrer le modèle
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // Ajuster taille si trop grand
    const size = box.getSize(new THREE.Vector3()).length();
    const scale = 2 / size;
    model.scale.setScalar(scale);

    // Animation si présente
    if (gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(gltf.animations[0]).play();
    }

    console.log("GLB chargé ✔");

}, undefined, (error) => {
    console.error(error);
});

function animate() {
    requestAnimationFrame(animate);

    if (mixer) {
        mixer.update(clock.getDelta());
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
