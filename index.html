<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VRM Dialogue Mode</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #0f0f0f;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>

<script>

let currentVrm = null;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 1, 1);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const loader = new THREE.GLTFLoader();

loader.load(
  './atest.vrm',
  function (gltf) {

    THREE.VRM.from(gltf).then(function (vrm) {

      currentVrm = vrm;
      scene.add(vrm.scene);

      vrm.scene.rotation.y = Math.PI;

      // 🔥 Pose naturelle bras relâchés
      const leftArm = vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.LeftUpperArm);
      const rightArm = vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.RightUpperArm);

      if (leftArm) leftArm.rotation.z = 0.5;
      if (rightArm) rightArm.rotation.z = -0.5;

      // 🔥 Cadrage tête dialogue
      const head = vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.Head);

      if (head) {

        const headPos = new THREE.Vector3();
        head.getWorldPosition(headPos);

        vrm.scene.position.set(0, -headPos.y + 1.4, 0);

        camera.position.set(0, 1.4, 1.2);
        camera.lookAt(0, 1.4, 0);
      }

      console.log("VRM prêt");
    });

  },
  undefined,
  function (error) {
    console.error(error);
  }
);

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (currentVrm) {

    currentVrm.update(delta);

    const t = clock.elapsedTime;

    // respiration subtile
    currentVrm.scene.position.y += Math.sin(t * 1.5) * 0.002;

    // léger mouvement tête
    const neck = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.Neck);
    if (neck) {
      neck.rotation.y = Math.sin(t * 0.5) * 0.05;
    }
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
