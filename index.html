<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VRM Dialogue</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>

<script>

let currentVrm;
let mixer;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, // plus naturel
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.5, 2.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 1, 1);
scene.add(light);

const loader = new THREE.GLTFLoader();

loader.load('./atest.vrm', (gltf) => {

  THREE.VRM.from(gltf).then((vrm) => {

    currentVrm = vrm;
    scene.add(vrm.scene);
    vrm.scene.rotation.y = Math.PI;

    // centrage automatique propre
    const box = new THREE.Box3().setFromObject(vrm.scene);
    const center = box.getCenter(new THREE.Vector3());
    vrm.scene.position.sub(center);

    vrm.scene.position.y = 0;

    // caméra regarde centre
    camera.lookAt(0, 1.4, 0);

    console.log("VRM ready");

  });

});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (currentVrm) {
    currentVrm.update(delta);
  }

  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
