<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NPC Avatar</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }
</style>
</head>

<body>

<script type="module">

// CDN imports (OBLIGATOIRE en GitHub Pages)
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/loaders/GLTFLoader.js";

let scene, camera, renderer, controls, mixer;
let clock = new THREE.Clock();

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

// Lumières propres
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);

// Chargement du modèle
const loader = new GLTFLoader();

loader.load("CombatCharacter.glb", (gltf) => {

  const model = gltf.scene;
  scene.add(model);

  // Centrage propre
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  model.position.x -= center.x;
  model.position.y -= center.y;
  model.position.z -= center.z;

  const maxDim = Math.max(size.x, size.y, size.z);

  // Caméra adaptée
  const fov = camera.fov * (Math.PI / 180);
  let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
  camera.position.set(0, size.y * 0.6, cameraZ * 1.3);

  controls.target.set(0, size.y * 0.6, 0);
  controls.update();

  // Animation auto si présente
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(gltf.animations[0]);
    action.play();
  }

});

// Resize propre
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Boucle animation
function animate() {
  requestAnimationFrame(animate);

  if (mixer) mixer.update(clock.getDelta());

  controls.update();
  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
