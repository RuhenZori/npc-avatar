<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VRM Full Body Idle</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>

<script>

let currentVrm;
let mixer;
const clock = new THREE.Clock();

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.4, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 1, 1);
scene.add(light);

const loader = new THREE.GLTFLoader();

loader.load('./atest.vrm', (gltf) => {

  THREE.VRM.from(gltf).then((vrm) => {

    currentVrm = vrm;
    scene.add(vrm.scene);

    vrm.scene.rotation.y = Math.PI;

    // 🔥 Centrage automatique corps entier
    const box = new THREE.Box3().setFromObject(vrm.scene);
    const center = box.getCenter(new THREE.Vector3());
    vrm.scene.position.sub(center);
    vrm.scene.position.y = 0;

    camera.lookAt(0, 1.2, 0);

    // 🔥 Animation Mixer
    mixer = new THREE.AnimationMixer(vrm.scene);

    const times = [0, 2];

    const neck = vrm.humanoid.getBoneNode(
      THREE.VRMSchema.HumanoidBoneName.Neck
    );

    if (neck) {

      const values = [
        0, 0, 0,
        0, 0.1, 0
      ];

      const track = new THREE.VectorKeyframeTrack(
        neck.name + '.rotation',
        times,
        values
      );

      const clip = new THREE.AnimationClip('idle', -1, [track]);

      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopPingPong);
      action.play();
    }

    console.log("VRM animé");

  });

});

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (currentVrm) {
    currentVrm.update(delta);
  }

  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
