<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VRM Dialogue</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #0f0f0f;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>

<script>

let currentVrm = null;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 1, 1);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const loader = new THREE.GLTFLoader();

loader.load(
  './atest.vrm',
  function (gltf) {

    THREE.VRM.from(gltf).then(function (vrm) {

      currentVrm = vrm;
      scene.add(vrm.scene);

      vrm.scene.rotation.y = Math.PI;

      // 🔥 CENTRAGE AUTOMATIQUE
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      vrm.scene.position.x += (vrm.scene.position.x - center.x);
      vrm.scene.position.y += (vrm.scene.position.y - center.y);
      vrm.scene.position.z += (vrm.scene.position.z - center.z);

      // 🔥 CAMERA ADAPTÉE
      const height = size.y;
      camera.position.set(0, height * 0.6, height * 1.5);
      camera.lookAt(0, height * 0.6, 0);

      console.log("VRM chargé et centré");
    });

  },
  undefined,
  function (error) {
    console.error(error);
  }
);

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (currentVrm) {

    currentVrm.update(delta);

    const t = clock.elapsedTime;

    // respiration légère
    currentVrm.scene.position.y += Math.sin(t * 1.5) * 0.002;
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
